name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FITNESS_ALLOW_FIXTURE_IN_PRODUCTION: "true"
      FITNESS_DATA_SOURCE: fixture
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium E2E tests
        id: e2e_tests
        run: |
          pnpm test:e2e:functional
          PLAYWRIGHT_REUSE_BUILD=true pnpm test:e2e:empty
          PLAYWRIGHT_REUSE_BUILD=true pnpm test:e2e:all-error
          PLAYWRIGHT_REUSE_BUILD=true pnpm test:e2e:workouts-error

      - name: Upload Playwright failure artifacts
        if: ${{ failure() && steps.e2e_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
