name: Visual Regression

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    name: Linux visual regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    env:
      FITNESS_ALLOW_FIXTURE_IN_PRODUCTION: "true"
      FITNESS_DATA_SOURCE: fixture
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linux visual regression tests
        id: visual_tests
        run: |
          pnpm test:e2e:visual
          pnpm test:e2e:visual:empty
          pnpm test:e2e:visual:all-error
          pnpm test:e2e:visual:workouts-error

      - name: Upload visual regression failure artifacts
        if: ${{ failure() && steps.visual_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
